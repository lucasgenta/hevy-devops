# =============================================================================
# Hevy Gateway — Nginx configuration
# =============================================================================
# This acts as the single entry point for all incoming traffic. It:
#   - Reverse proxies requests to the Streamlit dashboard
#   - Provides load balancing (add upstream servers for horizontal scaling)
#   - Enforces rate limiting
#   - Handles WebSocket upgrades (required by Streamlit)
#   - Exposes a /healthz endpoint for health checks
# =============================================================================

# --- Rate limiting zones ----------------------------------------------------
limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=30r/s;

# --- Upstream: Dashboard service (Streamlit) --------------------------------
# Add multiple `server` lines to distribute load across replicas.
# Example with 3 replicas:
#   server dashboard:8501 weight=3;
#   server dashboard:8502 weight=2;
#   server dashboard:8503 weight=1;
upstream dashboard_backend {
    server dashboard:8501;
    # Add more instances here when scaling horizontally
}

# --- Main server block ------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # ------------------------------------------------------------------
    # Health check endpoint (exempt from dashboard rate limit)
    # ------------------------------------------------------------------
    location /healthz {
        limit_req zone=health_limit burst=10 nodelay;
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
        add_header Cache-Control no-cache;
    }

    # ------------------------------------------------------------------
    # Streamlit proxy — all other traffic
    # ------------------------------------------------------------------
    location / {
        limit_req zone=dashboard_limit burst=20 nodelay;

        proxy_pass http://dashboard_backend;

        # Standard proxy headers
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;

        # WebSocket support (required by Streamlit for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade                 $http_upgrade;
        proxy_set_header Connection              "upgrade";

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Max body size (for any future upload)
        client_max_body_size 10m;
    }

    # ------------------------------------------------------------------
    # Deny access to sensitive paths
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ (\.env|\.git) {
        deny all;
        access_log off;
    }
}

# ------------------------------------------------------------------
# HTTP response headers (applied globally)
# ------------------------------------------------------------------
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
