[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hevy-scraper"
version = "0.1.0"
description = "Scrape, analyze workout + nutrition data, and sync with Asana"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.30",
    "plotly>=5.18",
    "asana>=5.0.0",
]

[project.scripts]
hevy-scrape = "scripts.scrape:main"
hevy-dashboard = "scripts.run_dashboard:main"
hevy-weekly = "scripts.weekly_report:main"
